name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The extension has no per-OS code, but paths, worker threads and the
    # engine's WASM loading all go through the runner's own Node and `path`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The whole job takes about a minute; anything past this is a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test hands its glob to node --test (Node 21+); ESLint 10 needs 20.19+
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run lint
      - run: npm run check:media
      - run: npm test
        timeout-minutes: 3
      # The file list is the same on every OS; once is enough.
      - run: npm run check:package
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 3
