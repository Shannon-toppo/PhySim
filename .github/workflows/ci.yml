name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes about a minute; anything past this is a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test hands its glob to node --test (Node 21+); ESLint 10 needs 20.19+
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run lint
      - run: npm run check:media
      - run: npm test
        timeout-minutes: 3
